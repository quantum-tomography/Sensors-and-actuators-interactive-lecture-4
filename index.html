<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Електрически машини</title>
<style>
:root { --bg:#0b1220; --card:#111a2e; --text:#e7eefc; --muted:#a8b3cf; --accent:#4da3ff; --good:#3ddc97; --bad:#ff5c7a; }
*{ box-sizing:border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
body{ margin:0; background:linear-gradient(160deg,#081022,#0b1220); color:var(--text); }
header{ position:sticky; top:0; backdrop-filter: blur(10px); background:rgba(11,18,32,.7); border-bottom:1px solid rgba(255,255,255,.08); z-index:10; }
.wrap{ max-width:1000px; margin:0 auto; padding:18px; }
.row{ display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
.title{ font-weight:700; letter-spacing:.2px; }
.sub{ color:var(--muted); font-size:14px; }
.bar{ height:10px; background:rgba(255,255,255,.08); border-radius:999px; overflow:hidden; }
.bar > div{ height:100%; width:0%; background:linear-gradient(90deg,var(--accent),#7cc6ff); transition:width .25s ease; }
main{ padding:20px 0 60px; }
.card{ background:rgba(17,26,46,.85); border:1px solid rgba(255,255,255,.08); border-radius:18px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
.cardPad{ padding:18px; }
.grid{ display:grid; grid-template-columns:1fr; gap:14px; }
@media(min-width:900px){ .grid{ grid-template-columns: 2fr 1fr; } }
.h1{ font-size:26px; margin:0 0 10px; display:inline-block; position:relative; }
.h1::after{ content:""; display:block; width:58%; height:3px; margin-top:8px; border-radius:999px; background:linear-gradient(90deg, rgba(77,163,255,.95), rgba(124,198,255,.15)); }
.h2{ font-size:18px; margin:18px 0 10px; color:#d8e6ff; }
ul{ margin:10px 0 0 18px; color:var(--text); }
li{ margin:6px 0; }
.pill{ display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border-radius:999px; background:rgba(77,163,255,.12); border:1px solid rgba(77,163,255,.35); color:#cfe7ff; font-size:12px; }
.btns{ display:flex; gap:10px; flex-wrap:wrap; }
button{ border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.06); color:var(--text); padding:10px 14px; border-radius:12px; cursor:pointer; }
button:hover{ background:rgba(255,255,255,.10); }
button.primary{ background:rgba(77,163,255,.20); border-color:rgba(77,163,255,.55); }
.footerNav{ position:fixed; bottom:0; left:0; right:0; background:rgba(11,18,32,.75); border-top:1px solid rgba(255,255,255,.08); backdrop-filter: blur(10px); }
.footerNav .wrap{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
.book{ max-width:70ch; margin:0; }
.book p{ color:var(--text); line-height:1.85; margin:10px 0; font-size:16px; }
.book p.lead{ color:#d8e6ff; font-size:16px; }
.book .dropcap:first-letter{ float:left; font-size:42px; line-height:38px; padding:6px 8px 0 0; color:#d8e6ff; font-weight:800; }
.quizBox{ margin-top:12px; border:1px solid rgba(255,255,255,.10); background:rgba(255,255,255,.03); border-radius:16px; padding:14px; }
.qTitle{ font-weight:800; color:#d8e6ff; margin:0 0 8px; }
.qPrompt{ margin:0 0 12px; line-height:1.75; color:var(--text); }
.qOptions{ display:grid; gap:10px; }
.qOpt{ text-align:left; border-radius:14px; padding:12px 12px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.05); }
.qOpt:hover{ background:rgba(255,255,255,.08); }
.qOpt.correct{ border-color:rgba(61,220,151,.55); background:rgba(61,220,151,.12); }
.qOpt.wrong{ border-color:rgba(255,92,122,.55); background:rgba(255,92,122,.12); }
.qFeedback{ margin-top:12px; padding:10px 12px; border-radius:14px; border:1px solid rgba(255,255,255,.10); background:rgba(0,0,0,.18); color:var(--text); line-height:1.6; }
</style>
</head>
<body>
<header><div class="wrap"><div class="row"><div><div class="title" id="courseTitle"></div><div class="sub" id="courseSub"></div></div><div class="pill"><span id="slideCounter"></span></div></div><div style="margin-top:12px" class="bar"><div id="progressFill"></div></div></div></header>
<main><div class="wrap"><div class="grid"><section class="card cardPad" id="slide"></section><aside class="card cardPad"><div class="h2">Learning outcomes</div><ul id="goals"></ul></aside></div></div></main>
<div class="footerNav"><div class="wrap"><div class="btns"><button id="btnPrev">← Prev</button><button id="btnNext" class="primary">Next →</button></div><div class="sub" id="statusLine"></div></div></div>
<script>
const lessonData = {
  "courseTitle": "Електрически машини",
  "courseSub": "Постояннотокови и променливотокови машини",
  "learningOutcomes": [
    "Describe the main idea of the topic.",
    "Identify the most important concepts.",
    "Apply the lecture ideas in a simple example."
  ],
  "slides": [
    {
      "id": "s_ezisbi2t",
      "type": "content",
      "title": "Кратък преговор на елекромагнитното взаимодействие",
      "text": "Нека преди всичко да направим кратък преговор върху свойствата на магнитното поле и взаймодействието му с електрическия ток, което е важно за разбирането на работата на всеки ел. двигател.\n",
      "bullets": [],
      "useDropcap": true
    },
    {
      "id": "s_1fojsvtg",
      "type": "content",
      "title": "Кратък преговор на елекромагнитното взаимодействие",
      "text": "Електрическото поле се създава от ел. заряди и действа със сила \nна неподвижните или движещите се такива. \n\nПосоката на силата е по права, свързваща центровете на двата взаимодействащи заряда.\n\nТова е най-простото разпределение на сила в механиката.\n\n\n\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/Slide3.PNG\" target=\"_blank\">\n    <img src=\"images/Slide3.PNG\" alt=\"Линии на електрическото поле\" style=\"max-width:600px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">Линии на електрическото поле (click to enlarge)<\/div>\n<\/div>",
      "bullets": [],
      "useDropcap": true
    },
    {
      "id": "s_icku12ri",
      "type": "content",
      "title": "Кратък преговор на елекромагнитното взаимодействие",
      "text": "За разлика от електрическото, магнитното поле  е малко по-различно. \n\nТо се създава от токове (подвижни заряди) и действа със сила само върху подвижните заряди. \n\nАко по показания кръгов проводник протича ток, накъде ще се ориентира поставената в средата \n\nмагнитна стрелка на компас?\n\n\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/Slide4.PNG\" target=\"_blank\">\n    <img src=\"images/Slide4.PNG\" alt=\"Линии на магнитното поле\" style=\"max-width:250px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">Линии на магнитното поле (click to enlarge)<\/div>\n<\/div>",
      "bullets": [],
      "useDropcap": true
    },
    {
      "id": "s_8f46ipre",
      "type": "content",
      "title": "Кратък преговор на елекромагнитното взаимодействие",
      "text": "Противно на интуицията, силата която действа на стрелката не е към или обратно на провидника.\n\nСилата е перпендикулярна на която и да е права, свързваща точки от проводника с ток.\n\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/Slide5.PNG\" target=\"_blank\">\n    <img src=\"images/Slide5.PNG\" alt=\"Линии на магнитното поле\" style=\"max-width:250px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">Линии на магнитното поле (click to enlarge)<\/div>\n<\/div>",
      "bullets": [],
      "useDropcap": true
    },
    {
      "id": "s_bwxyo4ka",
      "type": "content",
      "title": "Кратък преговор на елекромагнитното взаимодействие",
      "text": "Затова, не е учудващо че силовите линии на магнитното поле са разпределени по показания начин.\n\nТе показват накъде би сочела силата упражнявана върху малка, тестова магнитна стрелка. \n\n\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/Slide6.PNG\" target=\"_blank\">\n    <img src=\"images/Slide6.PNG\" alt=\"Линии на магнитното поле\" style=\"max-width:250px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">Линии на магнитното поле (click to enlarge)<\/div>\n<\/div>",
      "bullets": [],
      "useDropcap": true
    },
    {
      "id": "s_3qsj14my",
      "type": "content",
      "title": "Кратък преговор на елекромагнитното взаимодействие",
      "text": "Както би се очаквало от предходния слайд, ако поръсим железни пилки върху една повърхност около\n\nпроводник с ток, те биха показали вихровия характер на магнитното поле. \n\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/Slide7.PNG\" target=\"_blank\">\n    <img src=\"images/Slide7.PNG\" alt=\"Линии на магнитното поле\" style=\"max-width:150px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">Линии на магнитното поле (click to enlarge)<\/div>\n<\/div>",
      "bullets": [],
      "useDropcap": true
    },
    {
      "id": "s_8wafabpw",
      "type": "content",
      "title": "Кратък преговор на елекромагнитното взаимодействие",
      "text": "Нека припомним законът на Майкъл Фарадей за магнитната индукция. \n\nПри промяна на магнитния поток през един проводников контур, \n\nв него възниква електродвижещо напрежение. То се опитва да създаде ток през проводника.\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/Slide8.PNG\" target=\"_blank\">\n    <img src=\"images/Slide8.PNG\" alt=\"Поток на магнитното поле\" style=\"max-width:150px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">Поток на магнитното поле (click to enlarge)<\/div>\n<\/div>",
      "bullets": [],
      "useDropcap": true
    },
    {
      "id": "s_1pqqdbur",
      "type": "content",
      "title": "Кратък преговор на елекромагнитното взаимодействие",
      "text": "Магнитното поле, генерирано от навивка с ток и това от постоянен магнит е много сходно.\n\nЖелезни стружки, поръсени около постоянния магнит визуализират силовите линии на магнитното поле.\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/Slide9.PNG\" target=\"_blank\">\n    <img src=\"images/Slide9.PNG\" alt=\"Разпределение на магнитното поле\" style=\"max-width:350px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">Разпределение на магнитното поле (click to enlarge)<\/div>\n<\/div>",
      "bullets": [],
      "useDropcap": true
    },
    {
      "id": "s_ezpj6gbu",
      "type": "content",
      "title": "Кратък преговор на елекромагнитното взаимодействие",
      "text": "<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/Slide10.PNG\" target=\"_blank\">\n    <img src=\"images/Slide10.PNG\" alt=\"Силово действие от страна на магнитното поле върху проводник с ток\" style=\"max-width:350px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">Силово действие от страна на магнитното поле върху проводник с ток (click to enlarge)<\/div>\n<\/div>\n\nПроводник с ток, внесен в магнитно поле изпитва сила. Дължи се на силата упражнявана върху подвижните ел. заряди на тока от страна на магн. поле. \n\nПоради същата причина, проводникова рамка с ток, поставена в магн. поле би се завъртяла.\n\n\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/Slide12.PNG\" target=\"_blank\">\n    <img src=\"images/Slide12.PNG\" alt=\"Рамка с ток в магнитно поле\" style=\"max-width:350px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">Рамка с ток в магнитно поле (click to enlarge)<\/div>\n<\/div>\n\n\n\nАко полярността на тока се обърне, рамката ще се завърти наобратно. \n\nТака поради инерцията й, тя ще продължава да се върти с постоянна посока.\n\nТакова е действието на постояннотоковия двигател, който е даден като пример, първоначално по-лесен за възприемане. \n\n\n\n\n<div style=\"text-align:center;margin:20px 0;\">\n  <a href=\"images/Slide13.PNG\" target=\"_blank\">\n    <img src=\"images/Slide13.PNG\" alt=\"Четков постояннотоков двигател\" style=\"max-width:450px;width:100%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;\">\n  <\/a>\n  <div style=\"font-size:0.9em;color:#a8b3cf;margin-top:6px;\">Четков постояннотоков двигател (click to enlarge)<\/div>\n<\/div>",
      "bullets": [],
      "useDropcap": true
    }
  ]
};
let state = { idx:0, quiz:{} };
const $ = (sel) => document.querySelector(sel);
function escapeHtml(str){ return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;").replace(/'/g, "&#39;"); }
function paragraphsFromText(text){ return String(text || "").split(/\n\s*\n/).map(s => s.trim()).filter(Boolean); }
function renderContent(sl){ const rawText = String(sl.text || ""); const containsHtml = /<[^>]+>/.test(rawText); let pHtml = ""; if(containsHtml){ pHtml = rawText; } else { paragraphsFromText(rawText).forEach((p,i)=>{ const cls = i===0 ? (sl.useDropcap ? "lead dropcap" : "lead") : ""; pHtml += "<p class=\""+cls+"\">" + escapeHtml(p) + "</p>"; }); } if(!pHtml){ pHtml = "<p class=\"lead dropcap\">Add slide text in the editor.</p>"; } let ul = ""; if((sl.bullets||[]).length){ ul = "<ul>"; sl.bullets.forEach(b=> ul += "<li>"+escapeHtml(b)+"</li>"); ul += "</ul>"; } return "<div class=\"h1\">"+escapeHtml(sl.title)+"</div><div class=\"book\">"+pHtml+ul+"</div>"; }
function renderQuiz(sl){ const prev = state.quiz[sl.id]; const chosen = prev && typeof prev.selectedIndex === "number" ? prev.selectedIndex : null; const answered = !!prev; let opts = ""; sl.options.forEach((txt,i)=>{ let cls = "qOpt"; if(answered){ if(i===sl.correctIndex) cls += " correct"; else if(i===chosen) cls += " wrong"; } opts += "<button class=\""+cls+"\" data-i=\""+i+"\" type=\"button\">"+escapeHtml(txt)+"</button>"; }); const fb = answered ? "<div class=\"qFeedback\">" + (prev.isCorrect ? "✅ Correct. " : "❌ Not quite. ") + escapeHtml(sl.explanation || "") + "</div>" : ""; return "<div class=\"quizBox\"><div class=\"qTitle\">"+escapeHtml(sl.title)+"</div><p class=\"qPrompt\">"+escapeHtml(sl.question||"")+"</p><div class=\"qOptions\">"+opts+"</div>"+fb+"</div>"; }
function wireQuiz(sl){ document.querySelectorAll(".qOpt").forEach(btn => { btn.onclick = () => { const i = Number(btn.getAttribute("data-i")); state.quiz[sl.id] = { selectedIndex:i, isCorrect:i === sl.correctIndex }; render(); }; }); }
function render(){ $("#courseTitle").textContent = lessonData.courseTitle; $("#courseSub").textContent = lessonData.courseSub; const goals = $("#goals"); goals.innerHTML = ""; (lessonData.learningOutcomes || []).forEach(g => { const li = document.createElement("li"); li.textContent = g; goals.appendChild(li); }); state.idx = Math.max(0, Math.min(state.idx, lessonData.slides.length - 1)); $("#slideCounter").textContent = (state.idx + 1) + " / " + lessonData.slides.length; $("#progressFill").style.width = (((state.idx + 1)/lessonData.slides.length) * 100) + "%"; const sl = lessonData.slides[state.idx]; $("#slide").innerHTML = sl.type === "quiz" ? renderQuiz(sl) : renderContent(sl); $("#statusLine").textContent = sl.type === "quiz" ? "Quick Check" : "Reading slide"; $("#btnPrev").disabled = state.idx === 0; $("#btnNext").disabled = state.idx === lessonData.slides.length - 1; if(sl.type === "quiz") wireQuiz(sl); }
$("#btnPrev").onclick = () => { state.idx = Math.max(0, state.idx - 1); render(); };
$("#btnNext").onclick = () => { state.idx = Math.min(lessonData.slides.length - 1, state.idx + 1); render(); };
document.addEventListener("keydown", (e) => { if(e.key === "ArrowLeft"){ state.idx = Math.max(0, state.idx - 1); render(); } else if(e.key === "ArrowRight"){ state.idx = Math.min(lessonData.slides.length - 1, state.idx + 1); render(); } });
render();
</script>
</body>
</html>
